apiVersion: v1
kind: Service
metadata:
  name: keymaker-service
  namespace: namespace-uc002
  labels:
    app: keymaker-service
    tenant: usecase-002
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app: keymaker-service
  ports:
    - name: http
      protocol: TCP
      port: 8071
      targetPort: 8071
