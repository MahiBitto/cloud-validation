apiVersion: apps/v1
kind: Deployment
metadata:
  name: keymaker-service
  namespace: namespace-uc002
  labels:
    app: keymaker-service
    tenant: usecase-002
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keymaker-service
  template:
    metadata:
      labels:
        app: keymaker-service
        tenant: usecase-002
    spec:
      serviceAccountName: keymaker-admin

      nodeSelector:
        #cloud.google.com/gke-nodepool: keymaker-pool
        cloud.google.com/gke-nodepool: nodepool-workload-identity
        iam.gke.io/gke-metadata-server-enabled: "true"

      containers:
        - name: keymaker-service
          image: us-east1-docker.pkg.dev/prj-uc001-dev-768e/keymaker/keymaker-service:0.0.3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8071

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
