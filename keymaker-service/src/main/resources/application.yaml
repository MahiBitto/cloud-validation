spring:
  application:
    name: keymaker-service

server:
  port: 8071

keymaker:
  gcp:
    project-id: pxp-bdp-dev
    spanner:
      instance: keymaker-spanner
      database: keymaker-db

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
